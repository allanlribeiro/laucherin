pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url 'https://jitpack.io' } }
            filter { includeGroup 'com.github.teamnewpipe'; includeGroup 'com.github.TeamNewPipe' }
        }
    }
}
rootProject.name = "tvhome"
include ':app'
